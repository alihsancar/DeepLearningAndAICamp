<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Diyabet Analiz Merkezi</title>
    <!-- Modern Yazı Tipi -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <div class="container">
        <div class="header">
            <h1>🔬 AI Diyabet Analiz</h1>
            <p>Laboratuvar verilerini girerek derin öğrenme modelinden anında tahmin alın.</p>
        </div>

        <form id="predictionForm">
            <div class="form-grid">
                <div class="input-group">
                    <label>Cinsiyet (0=Kadın, 1=Erkek)</label>
                    <input type="number" step="1" id="Gender" placeholder="Örn: 1" required>
                </div>
                <div class="input-group">
                    <label>Yaş (AGE)</label>
                    <input type="number" step="1" id="AGE" placeholder="Örn: 45" required>
                </div>
                <div class="input-group">
                    <label>Üre (Urea)</label>
                    <input type="number" step="0.1" id="Urea" placeholder="Örn: 4.5" required>
                </div>
                <div class="input-group">
                    <label>Kreatinin (Cr)</label>
                    <input type="number" step="0.01" id="Cr" placeholder="Örn: 62" required>
                </div>
                <div class="input-group">
                    <label>HbA1c</label>
                    <input type="number" step="0.1" id="HbA1c" placeholder="Örn: 5.7" required>
                </div>
                <div class="input-group">
                    <label>Kolesterol (Chol)</label>
                    <input type="number" step="0.1" id="Chol" placeholder="Örn: 4.9" required>
                </div>
                <div class="input-group">
                    <label>Trigliserit (TG)</label>
                    <input type="number" step="0.1" id="TG" placeholder="Örn: 1.4" required>
                </div>
                <div class="input-group">
                    <label>HDL</label>
                    <input type="number" step="0.1" id="HDL" placeholder="Örn: 1.1" required>
                </div>
                <div class="input-group">
                    <label>LDL</label>
                    <input type="number" step="0.1" id="LDL" placeholder="Örn: 2.1" required>
                </div>
                <div class="input-group">
                    <label>VLDL</label>
                    <input type="number" step="0.1" id="VLDL" placeholder="Örn: 0.6" required>
                </div>
                <div class="input-group">
                    <label>Vücut Kitle İndeksi (BMI)</label>
                    <input type="number" step="0.1" id="BMI" placeholder="Örn: 23.0" required>
                </div>
            </div>

            <button type="submit" class="submit-btn">
                <span>Modeli Çalıştır</span>
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </button>
        </form>

        <div id="resultBox" class="result-card hidden">
            <h3 class="result-title">Analiz Sonucu</h3>
            <p id="resultText" class="result-value"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
